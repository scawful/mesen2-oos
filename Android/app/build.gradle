apply plugin: 'com.android.application'

def ndkVer = System.getenv("ANDROID_NDK_VERSION") ?: "30.0.16248370"

android {
    namespace "ca.mesen.oos"
    compileSdk 34
    ndkVersion ndkVer

    defaultConfig {
        applicationId "ca.mesen.oos"
        minSdk 21
        targetSdk 30
        versionCode 13
        versionName "0.1.12-handheld"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Keep the signed debug packaging flow, but compile the native
                // core and SDL with the handheld release profile.
                arguments "-DANDROID_STL=c++_shared",
                        "-DCMAKE_C_FLAGS_DEBUG=-O3 -g0 -DNDEBUG -mtune=cortex-a55 -flto=thin",
                        "-DCMAKE_CXX_FLAGS_DEBUG=-O3 -g0 -DNDEBUG -mtune=cortex-a55 -flto=thin",
                        "-DCMAKE_SHARED_LINKER_FLAGS_DEBUG=-flto=thin -Wl,--gc-sections"
                cppFlags "-std=c++17 -fexceptions -frtti -fPIC"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    lint {
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
}

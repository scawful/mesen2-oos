apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def ndkVer = System.getenv("ANDROID_NDK_VERSION") ?: "30.0.16248370"
def pgoMode = (project.findProperty("YAZE_ANDROID_PGO") ?: System.getenv("YAZE_ANDROID_PGO") ?: "").toString().trim()
def pgoProfdata = (project.findProperty("YAZE_PGO_PROFDATA") ?: System.getenv("YAZE_PGO_PROFDATA") ?: "").toString().trim()

// Instrumented generate builds skip ThinLTO for simpler/faster profile collection.
// Optimize and normal builds keep -O3 + ThinLTO + Cortex-A55.
def nativeCFlags
def nativeCxxFlags
def nativeLdFlags
def cmakeExtra = ["-DANDROID_STL=c++_shared"]

if (pgoMode == "generate") {
    // Match optimize -O3 so profile counts map onto the same IR shape. Skip
    // ThinLTO here; the optimize pass reapplies LTO with -fprofile-instr-use.
    nativeCFlags = "-O3 -g0 -DNDEBUG -mcpu=cortex-a55"
    nativeCxxFlags = nativeCFlags
    nativeLdFlags = "-Wl,--gc-sections"
    cmakeExtra.add("-DYAZE_ANDROID_PGO=generate")
} else if (pgoMode == "optimize") {
    if (pgoProfdata.isEmpty()) {
        throw new GradleException("YAZE_ANDROID_PGO=optimize requires YAZE_PGO_PROFDATA")
    }
    nativeCFlags = "-O3 -g0 -DNDEBUG -mcpu=cortex-a55 -flto=thin"
    nativeCxxFlags = nativeCFlags
    nativeLdFlags = "-flto=thin -Wl,--gc-sections"
    cmakeExtra.add("-DYAZE_ANDROID_PGO=optimize")
    cmakeExtra.add("-DYAZE_PGO_PROFDATA=${pgoProfdata}")
} else {
    nativeCFlags = "-O3 -g0 -DNDEBUG -mcpu=cortex-a55 -flto=thin"
    nativeCxxFlags = nativeCFlags
    nativeLdFlags = "-flto=thin -Wl,--gc-sections"
}

android {
    namespace "ca.mesen.oos"
    compileSdk 34
    ndkVersion ndkVer

    defaultConfig {
        applicationId "ca.mesen.oos"
        minSdk 21
        targetSdk 30
        // Shipping = PGO optimize (must outrank generate + non-PGO handheld).
        // generate is lower so train installs can replace shipping with -d.
        versionCode pgoMode == "optimize" ? 1812 : (pgoMode == "generate" ? 1811 : 1810)
        versionName pgoMode == "optimize" ? "0.1.50-pgo" : (pgoMode == "generate" ? "0.1.50-pgo-gen" : "0.1.50")
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments(*(cmakeExtra + [
                        "-DCMAKE_C_FLAGS_DEBUG=${nativeCFlags}",
                        "-DCMAKE_CXX_FLAGS_DEBUG=${nativeCxxFlags}",
                        "-DCMAKE_SHARED_LINKER_FLAGS_DEBUG=${nativeLdFlags}",
                        "-DCMAKE_C_FLAGS_RELWITHDEBINFO=${nativeCFlags}",
                        "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=${nativeCxxFlags}",
                        "-DCMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO=${nativeLdFlags}",
                        "-DCMAKE_C_FLAGS_RELEASE=${nativeCFlags}",
                        "-DCMAKE_CXX_FLAGS_RELEASE=${nativeCxxFlags}",
                        "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=${nativeLdFlags}"
                ]))
                cppFlags "-std=c++17 -fexceptions -frtti -fPIC"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
            jniDebuggable false
        }
        debug {
            jniDebuggable(project.hasProperty("jniDebug") && project.property("jniDebug").toString() == "true")
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def oracleDebugDir = rootProject.file("../../oracle-of-secrets/Data/debug")
tasks.register("syncOracleData", Copy) {
    onlyIf { oracleDebugDir.isDirectory() }
    from(oracleDebugDir) {
        include "checkpoints.json", "warps.json"
    }
    into file("src/main/assets/oracle")
}
preBuild.dependsOn("syncOracleData")

dependencies {
    // Compose launcher + pause menu (ui/OracleUi.kt). No Material: the UI draws its own styles.
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    testImplementation 'junit:junit:4.13.2'
}
